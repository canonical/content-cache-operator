[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-cache-config"
version = "0.1.0"
description = "Interface library for the content-cache-config Juju relation."
requires-python = ">=3.12"
dependencies = [
    "ops>=3,<4",
    "pydantic>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cache_config"]
