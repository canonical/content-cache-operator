[project]
name = "cache-config"
version = "0.1.0"
description = "Requirer/provider models for the content-cache 'cache-config' relation interface."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "ops>=2.15",
  "pydantic>=2.14.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_config"]
