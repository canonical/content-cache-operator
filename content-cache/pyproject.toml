[project]
name = "content-cache"
# This charm is not a Python distribution (`tool.uv.package = false`). Charm releases are
# versioned independently by their Charmhub revision and channel.
version = "0.0.0"
description = "A machine charm managing an nginx content cache."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "charmlibs-interfaces-certificate-transfer>=1.0.0,<2.0.0",
    "cosl==1.11.3",
    "cryptography==50.0.2",
    "ops==3.9.0",
    "pydantic==2.14.3",
    "python-nginx==1.5.7",
    "requests==2.34.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["lib", "src"]
