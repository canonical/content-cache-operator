type: charm

base: ubuntu@24.04

platforms:
  amd64:
    build-on: amd64
    build-for: amd64

parts:
  charm:
    plugin: uv
    # Monorepo support (Charmcraft >= 4.5, pack with CHARMCRAFT_EXPERIMENTAL_MONOREPO=1):
    # mounts the whole repo so pyproject.toml's path dependency on ../libs/cache_config
    # resolves at build time. Plain symlinks/dump-parts reaching outside this charm's own
    # directory are not packaged by charmcraft; the legacy (non-uv) "charm" plugin also
    # hits an unrelated bug combined with source-subdir, hence the uv plugin here.
    source: ..
    source-subdir: content-cache-backends-config
    build-snaps:
      - astral-uv
    build-packages: [cargo, rustc, pkg-config, libffi-dev, libssl-dev]
    override-build: |
      rustup default stable 2>/dev/null || true
      craftctl default
