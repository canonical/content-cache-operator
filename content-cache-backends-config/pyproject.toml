[project]
name = "content-cache-backends-config"
# This charm is not a Python distribution (`tool.uv.package = false`). Charm releases are
# versioned independently by their Charmhub revision and channel.
version = "0.0.0"
description = "Subordinate charm providing backend configuration to content-cache."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "content-cache-config",
    "ops==3.9.0",
    "pydantic==2.14.1",
]

[tool.uv]
package = false

[tool.uv.sources]
content-cache-config = { workspace = true }

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["lib", "src"]
