name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/test_terraform_modules.yaml"

jobs:
  terraform-tests-lxd:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@0c8c3b8ab7c826146cb058bd73b62887e3b31944  # main
    secrets: inherit
    with:
      k8s-controller: false
      lxd-controller: true
      terraform-directories: '["terraform/charm/content_cache", "terraform/charm/content_cache_backends_config"]'
