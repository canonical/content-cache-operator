name: Test Terraform Module
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/terraform/**'
      - '.github/workflows/test_terraform_modules.yaml'

permissions:
  contents: read

jobs:
  test-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    with:
      lxd-controller: true
      k8s-controller: false
      terraform-directories: '["content-cache/terraform", "content-cache-backends-config/terraform", "terraform"]'
